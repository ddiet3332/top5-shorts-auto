# Single-run topic recommendation, original sources, curated new source, render, QA.
# No YouTube publish; provider license and original source ownership remain distinct.
name: TOP5 V32 - Auto stronger original 30s MP4
on:
  pull_request:
    paths:
      - '.github/workflows/top5_auto_v32.yml'
      - 'src/top5_auto_v32.py'
      - 'src/top5_auto_v29.py'
      - 'src/v28_fullscreen_builder.py'
      - 'src/top5_hook_selection.py'
      - 'tests/test_top5_auto_v32.py'
      - 'tests/test_v37_story.py'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Automatically choose or select a TOP5 topic'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - cat_surprises
          - dog_surprises
          - nature_moments
          - objects_oddities
          - human_moments
  push:
    branches: [main]
    paths:
      - '.github/workflows/top5_auto_v32.yml'
      - 'src/top5_auto_v32.py'
      - 'src/top5_auto_v29.py'
      - 'src/v37_cat_audition.py'
      - 'tests/test_top5_auto_v32.py'
      - 'tests/test_v36_action_sources.py'
      - 'tests/test_v37_story.py'
permissions:
  contents: read
concurrency:
  group: v32-auto-${{ github.ref }}
  cancel-in-progress: true
jobs:
  make-30-second-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-video.txt
      - uses: ./.github/actions/setup-video-tools
      - run: python -m pip install -r requirements-video.txt
      - name: 전체 회귀 테스트
        run: python -m unittest discover -s tests -v
      - name: Choose topic, add valid video challenger and render original 30s TOP5
        env:
          TOPIC: ${{ github.event.inputs.topic || (github.event_name == 'pull_request' && 'cat_surprises') || 'auto' }}
        run: python src/top5_auto_v32.py --topic "$TOPIC" --output output/v32_auto
      - name: Validate MP4 and extract frame and audio evidence
        run: |
          cd output/v32_auto
          video=TOP5_AUTO_V29_REVIEW_1080x1920.mp4
          ffmpeg -hide_banner -v error -xerror -i "$video" -map 0:v:0 -map 0:a:0 -f null -
          ffprobe -v error -show_streams -of json "$video" > V32_MP4_STREAMS.json
          # Limit measurements to the MP4 presentation interval. Some AAC
          # decoders expose the unused samples in the last encoded block.
          ffmpeg -hide_banner -v error -i "$video" -map 0:a:0 -af atrim=end_sample=1440000 -c:a pcm_f32le V32_AUDIO.wav
          ffmpeg -hide_banner -i V32_AUDIO.wav \
            -af 'ebur128=peak=true,astats,silencedetect=noise=-50dB:d=0.2' \
            -f null - 2> V32_AUDIO_METRICS.txt
          ffprobe -v error -select_streams a:0 -show_entries frame=best_effort_timestamp,nb_samples \
            -of csv=p=0 "$video" > V32_AUDIO_FRAMES.csv
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          video, audio = json.loads(Path("V32_MP4_STREAMS.json").read_text())["streams"]
          assert (video["width"], video["height"], video["nb_frames"]) == (1080, 1920, "720")
          assert video["avg_frame_rate"] == "24/1"
          assert audio["sample_rate"] == "48000"
          assert all(float(s["start_time"]) == 0 and float(s["duration"]) == 30 for s in (video, audio))
          with open("V32_AUDIO_FRAMES.csv", newline="") as frames:
              end = 0
              for start, samples in csv.reader(frames):
                  assert int(start) == end, f"Audio timestamp discontinuity at {start}, expected {end}"
                  end += int(samples)
          presented_samples = int(audio["duration_ts"])
          assert audio["time_base"] == "1/48000" and presented_samples == 30 * 48000
          padding = end - presented_samples
          assert 0 <= padding < 1024, f"Unexpected AAC sample count: {end}"
          Path("V32_AUDIO_QA.json").write_text(json.dumps({
              "start_offset_sec": 0, "presented_samples_per_channel": presented_samples,
              "decoded_samples_per_channel": end, "aac_tail_padding_samples": padding,
              "audio_timestamp_continuity": "PASS", "listening": "UNVERIFIED",
          }, indent=2) + "\n")
          print(f"1080x1920, 720 frames, 30s audio ({presented_samples} samples/channel, {padding} decoder padding)")
          PY
          ffmpeg -hide_banner -v error -i "$video" \
            -vf 'fps=4,scale=216:384,tile=8x3' -q:v 3 'V32_TIMELINE_%02d.jpg'
          ffmpeg -hide_banner -v error -i "$video" \
            -vf "select='eq(n,0)+eq(n,47)+eq(n,48)+eq(n,143)+eq(n,144)+eq(n,263)+eq(n,264)+eq(n,359)+eq(n,360)+eq(n,503)+eq(n,504)+eq(n,647)+eq(n,648)+eq(n,719)',scale=270:480,tile=7x2" \
            -frames:v 1 -update 1 -q:v 3 V32_CUT_BOUNDARIES.jpg
          # Rows: 0.000–0.167s, 26.833–27.000s, 27.042–27.208s, 29.792–29.958s.
          ffmpeg -hide_banner -v error -i "$video" \
            -vf "select='between(n,0,4)+between(n,644,653)+between(n,715,719)',scale=216:384,tile=5x4" \
            -frames:v 1 -update 1 -q:v 3 V32_ENDING_BOUNDARIES.jpg
          # 0, 0.25, 0.5, 1, 1.5 and 2 seconds. Each tile is 360x640.
          ffmpeg -hide_banner -v error -i "$video" \
            -vf "select='eq(n,0)+eq(n,6)+eq(n,12)+eq(n,24)+eq(n,36)+eq(n,48)',scale=360:640,tile=3x2" \
            -frames:v 1 -update 1 -q:v 2 V32_HOOK_PHONE_QA.jpg
          # One 360px-wide rendered caption sample per segment.
          ffmpeg -hide_banner -v error -i "$video" \
            -vf "select='eq(n,12)+eq(n,120)+eq(n,208)+eq(n,322)+eq(n,480)+eq(n,570)+eq(n,696)',scale=360:640,tile=4x2" \
            -frames:v 1 -update 1 -q:v 2 V32_CAPTIONS_PHONE_QA.jpg
      - name: Keep both video and not-approved rights evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TOP5-V32-auto-review-${{ github.run_number }}
          path: |
            output/v32_auto/TOP5_AUTO_V29_REVIEW_1080x1920.mp4
            output/v32_auto/V29_ACTUAL_12FRAME_QA.jpg
            output/v32_auto/V32_TECHNICAL_QA.json
            output/v32_auto/SELECTED_SOURCE_PROVENANCE.json
            output/v32_auto/INDEPENDENT_HOOK_AUDIT.json
            output/v32_auto/V32_RENDERED_HOOK_QA.jpg
            output/v32_auto/V32_ENDING_SOURCE.json
            output/v32_auto/work/captions.ass
            output/v32_auto/V32_MP4_STREAMS.json
            output/v32_auto/V32_AUDIO.wav
            output/v32_auto/V32_AUDIO_METRICS.txt
            output/v32_auto/V32_AUDIO_QA.json
            output/v32_auto/V32_TIMELINE_*.jpg
            output/v32_auto/V32_CUT_BOUNDARIES.jpg
            output/v32_auto/V32_ENDING_BOUNDARIES.jpg
            output/v32_auto/V32_HOOK_PHONE_QA.jpg
            output/v32_auto/V32_CAPTIONS_PHONE_QA.jpg
            output/v32_auto/V32_CHALLENGER_SELECTION.json
            output/v32_auto/V35_SOFA_CHALLENGER_QA.json
            output/v32_auto/V36_CANDIDATE_REPLACEMENTS_QA.json
            output/v32_auto/V37_STORY_AND_RIGHTS_QA.json
            output/v32_auto/V37_ATTRIBUTION_AND_PUBLISH_GATES.md
            output/v32_auto/TOPIC_RECOMMENDATIONS_V32.json
            output/v32_auto/SOURCE_SELECTION_REVIEW.json
            output/v32_auto/SOURCE_CREDITS_REVIEW.md
            output/v32_auto/V30_CREATIVE_AND_RIGHTS_GATES.json
          retention-days: 7
          if-no-files-found: warn
