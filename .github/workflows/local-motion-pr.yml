name: Free OpenCV motion extraction tests
on:
  pull_request:
    paths:
      - 'src/local_motion_metrics.py'
      - 'tests/test_local_motion_metrics.py'
      - '.github/workflows/local-motion-pr.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy opencv-python-headless
      - run: python -m pytest -q tests/test_local_motion_metrics.py
