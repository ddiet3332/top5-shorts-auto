name: TOP5 manual free-source discovery
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic to search on Wikimedia Commons
        required: true
        default: dog_surprises
        type: choice
        options:
          - dog_surprises
          - bird_actions
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-video-tools
      - run: python -m pip install -r requirements-video.txt
      - run: python -m unittest discover -s tests -q
      - name: Search, fetch and evaluate real originals
        env:
          DISCOVERY_TOPIC: ${{ inputs.topic }}
        run: python src/discover_new_top5.py --topic "$DISCOVERY_TOPIC" --output output/discovery
      - name: Check the report and any generated review MP4
        working-directory: output/discovery
        run: |
          python - <<'PY'
          import io
          import json
          import os
          from pathlib import Path
          import subprocess
          from PIL import Image

          report = json.loads(Path("DISCOVERY_REPORT.json").read_text(encoding="utf-8"))
          assert report["publication_approved"] is False
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print(report["status"], report["reason"], file=summary)
              print(json.dumps(report["funnel"]), file=summary)
          if "video" not in report:
              assert report["status"] in {"SOURCE_SHORTAGE", "EDITORIAL_REVIEW_REQUIRED"}
              raise SystemExit(0)
          video = report["video"]
          streams = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_streams", "-of", "json", video
          ]))["streams"]
          picture, audio = streams
          assert (picture["codec_name"], picture["width"], picture["height"],
                  picture["avg_frame_rate"], picture["nb_frames"]) == ("h264",1080,1920,"24/1","720")
          assert audio["codec_name"] == "aac"
          assert all(float(s["start_time"]) == 0 and float(s["duration"]) == 30 for s in streams)
          subprocess.run(["ffmpeg","-v","error","-xerror","-i",video,"-map","0:v","-map","0:a","-f","null","-"],
                         check=True, timeout=180)
          groups = {
              "HOOK": (0,.25,.5,1,1.5,1.958,2),
              "RANKS": [base+row["peak_motion_sec"]-row["cut_start"]
                        for base,row in zip((2,6,11,15,21),report["selected"],strict=True)],
              "REPLAY": (26.958,27,27.5,28,28.5,29,29.958),
              "CUTS": (1.958,2,5.958,6,10.958,11,14.958,15,20.958,21,26.958,27),
          }
          for name, timestamps in groups.items():
              width = min(4,len(timestamps))
              sheet = Image.new("RGB", (360*width,640*((len(timestamps)+width-1)//width)), "white")
              for i, t in enumerate(timestamps):
                  frame_n = min(719,max(0,round(t*24)))
                  # Decode the exact frame from the finished MP4.
                  data = subprocess.check_output([
                      "ffmpeg","-v","error","-i",video,"-vf",f"select=eq(n\\,{frame_n}),scale=360:640",
                      "-frames:v","1","-c:v","png","-f","image2pipe","-"
                  ],timeout=30)
                  sheet.paste(Image.open(io.BytesIO(data)),(360*(i%width),640*(i//width)))
              sheet.save(f"DISCOVERY_{name}_PHONE_QA.jpg",quality=92)
          with open("DISCOVERY_AUDIO_METRICS.txt","wb") as metrics:
              subprocess.run(["ffmpeg","-hide_banner","-i",video,"-map","0:a",
                              "-af","ebur128=peak=true,astats,silencedetect=n=-50dB:d=0.2",
                              "-f","null","-"],stderr=metrics,check=True,timeout=60)
          PY
      - name: Upload report and any rendered review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TOP5-discovery-${{ inputs.topic }}-${{ github.run_id }}
          path: |
            output/discovery/DISCOVERY_REPORT.json
            output/discovery/DISCOVERY_*_PHONE_QA.jpg
            output/discovery/DISCOVERY_AUDIO_METRICS.txt
            output/discovery/TOP5_AUTO_V29_REVIEW_1080x1920.mp4
            output/discovery/SOURCE_CREDITS_REVIEW.md
            output/discovery/V29_TECHNICAL_QA.json
            output/discovery/V32_ENDING_SOURCE.json
            output/discovery/work/captions.ass
          if-no-files-found: error
          retention-days: 7
