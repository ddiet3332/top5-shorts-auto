name: V32 dog original-source acquisition audit
on:
  push:
    paths:
      - '.github/workflows/v32-dog-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install inspection dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m venv /tmp/dog-audit
          /tmp/dog-audit/bin/pip install -q numpy pillow
      - name: Attempt independent original downloads and generate frame sheets
        run: /tmp/dog-audit/bin/python src/v37_dog_audition.py
      - name: Produce fail-closed machine-readable source inventory
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('output/dog_audition')
          root.mkdir(parents=True,exist_ok=True)
          manifest=root/'DOG_AUDITION.json'
          data=json.loads(manifest.read_text()) if manifest.exists() else {}
          rows=data.get('candidates',[])
          inventory=[]
          for row in rows:
              source=root/(row['id']+'.mp4')
              inventory.append({'id':row['id'],'source_page':row.get('page_url'),
                  'status':row.get('status','NOT_RUN'),'original_mp4_present':source.is_file(),
                  'bytes':source.stat().st_size if source.is_file() else 0,
                  'actual_action_verified':False,'rights_verified':False,
                  'publication_approved':False,'error':row.get('error_detail')})
          ready=sum(x['original_mp4_present'] for x in inventory)
          report={'stage':'V32_SOURCE_AUDIT_ONLY','originals_downloaded':ready,
              'five_originals_available':ready>=5,'editorial_score':None,
              'rights_verified':False,'publication_approved':False,
              'v32_final_mp4_created':False,'sources':inventory}
          (root/'V32_SOURCE_AUDIT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('V32 original files:',ready,'of',len(inventory))
          PY
      - name: Upload originals, frame sheets and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V32-dog-original-source-audit-${{ github.run_number }}
          path: output/dog_audition/
          retention-days: 7
          if-no-files-found: warn
