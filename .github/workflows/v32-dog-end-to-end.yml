name: V32 dog end-to-end MP4 build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v32-dog-end-to-end.yml'
      - '.github/actions/setup-video-tools/**'
      - 'requirements-dog-review.txt'
      - 'src/dog_run_evidence.py'
      - 'src/dog_editorial_evidence.py'
      - 'src/dog_replacement_gate.py'
      - 'src/dog_replacement_report.py'
      - 'src/dog_source_discovery.py'
      - 'src/dog_pixabay_discovery.py'
      - 'src/dog_source_audition.py'
      - 'tests/test_dog_replacement_gate.py'
      - 'tests/test_dog_replacement_report.py'
      - 'tests/test_dog_source_discovery.py'
      - 'tests/test_dog_pixabay_discovery.py'
      - 'tests/test_dog_source_audition.py'
      - 'sample/dog_editorial_profile_v1.json'
      - 'sample/dog_replacement_audition.json'
      - 'scripts/persist_dog_evidence.sh'
      - 'src/top5_reviewed_*.py'
      - 'src/top5_auto_v32.py'
      - 'src/top5_auto_v29.py'
      - 'src/v28_fullscreen_builder.py'
      - 'sample/top5_dog_source_catalog.json'
      - 'src/top5_locked_design.py'
      - 'sample/top5_design_lock_v1.json'
      - 'sample/dog_editorial_profile_v1.json'
      - 'sample/dog_replacement_audition.json'
  pull_request:
    paths:
      - '.github/workflows/v32-dog-end-to-end.yml'
      - '.github/actions/setup-video-tools/**'
      - 'requirements-dog-review.txt'
      - 'src/dog_run_evidence.py'
      - 'src/dog_editorial_evidence.py'
      - 'sample/dog_editorial_profile_v1.json'
      - 'sample/dog_replacement_audition.json'
      - 'scripts/persist_dog_evidence.sh'
      - 'src/top5_reviewed_*.py'
      - 'sample/top5_dog_source_catalog.json'
      - 'sample/dog_editorial_profile_v1.json'
      - 'sample/dog_replacement_audition.json'
      - 'tests/test_dog_run_evidence.py'
      - 'tests/test_dog_editorial_evidence.py'
      - 'src/dog_replacement_gate.py'
      - 'src/dog_replacement_report.py'
      - 'src/dog_source_discovery.py'
      - 'src/dog_source_audition.py'
      - 'tests/test_dog_replacement_gate.py'
      - 'tests/test_dog_replacement_report.py'
      - 'tests/test_dog_source_discovery.py'
      - 'tests/test_dog_pixabay_discovery.py'
      - 'tests/test_dog_source_audition.py'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: dog-review-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dog-review.txt
      - name: Install bounded free dependencies
        id: install
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          command -v python timeout
          python --version
          python -m pip --version
          timeout --signal=TERM --kill-after=15s 240s python -m pip install \
            --disable-pip-version-check --no-input --timeout 20 --retries 2 \
            --only-binary=:all: -r requirements-dog-review.txt
          python -m pip check
          python -c 'import cv2, numpy, PIL; print(cv2.__version__, numpy.__version__, PIL.__version__)'
      - name: Set up FFmpeg and Korean fonts
        timeout-minutes: 5
        uses: ./.github/actions/setup-video-tools
      - name: Check executables and run regression tests
        timeout-minutes: 6
        run: |
          command -v python ffmpeg ffprobe fc-match
          python -m unittest discover -s tests -q
      - name: Download the exact Issue 130 regression fixture
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '14672834682'
          run-id: '44825600263'
          github-token: ${{ github.token }}
          path: output/fixture
      - name: Discover Pixabay dog candidates using existing repository secret
        timeout-minutes: 2
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python src/dog_pixabay_discovery.py --output output/dog/DOG_PIXABAY_CANDIDATES.json
      - name: Discover bounded free dog source candidates
        timeout-minutes: 2
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python src/dog_source_discovery.py --output output/dog/DOG_DISCOVERY_CANDIDATES.json
      - name: Generate two bounded candidate previews
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          python src/dog_source_audition.py \
            --discovery output/dog/DOG_DISCOVERY_CANDIDATES.json \
            --output output/dog/audition
      - name: Archive candidate previews for human review
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dog-candidate-previews-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/dog/DOG_DISCOVERY_CANDIDATES.json
            output/dog/DOG_PIXABAY_CANDIDATES.json
            output/dog/audition/DOG_AUDITION_RESULTS.json
            output/dog/audition/*_preview.mp4
          if-no-files-found: ignore
          retention-days: 7
      - name: Render five original dog sources with an independent hook
        id: render
        timeout-minutes: 12
        run: |
          args=(--editorial-profile sample/dog_editorial_profile_v1.json)
          if [[ "$GITHUB_EVENT_NAME" = pull_request ]]; then
            fixture="$(find output/fixture -name TOP5_AUTO_V29_REVIEW_1080x1920.mp4 -type f -print -quit)"
            test -n "$fixture"
            args+=(--baseline "$fixture")
          fi
          python src/top5_reviewed_render.py --topic dog_surprises --output output/dog "${args[@]}"
      - name: Record fail-closed editorial replacement readiness
        if: steps.render.outcome == 'success'
        run: |
          python src/dog_replacement_report.py --output output/dog/DOG_REPLACEMENT_READINESS.json
      - name: Measure the rendered audio stream
        timeout-minutes: 2
        run: |
          ffmpeg -nostdin -hide_banner -i output/dog/TOP5_AUTO_V29_REVIEW_1080x1920.mp4 \
            -map 0:a:0 -af 'atrim=end_sample=1440000,ebur128=peak=true,astats,silencedetect=n=-50dB:d=0.2' \
            -f null - 2> output/dog/DOG_AUDIO_METRICS.txt
      - name: Record attempt and validate any completed MP4
        if: always()
        id: evidence
        timeout-minutes: 6
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          set -euo pipefail
          archive="output/evidence/review/runs/$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$archive"
          if ! command -v python3 >/dev/null || [[ ! -f src/dog_run_evidence.py ]]; then
            printf '{"run_id":%s,"run_attempt":%s,"source_commit":"%s","status":"MP4_NOT_CREATED","reason":"EVIDENCE_PYTHON_OR_CHECKOUT_MISSING","full_decode":"NOT_RUN_NO_MP4","contact_sheet":"NOT_RUN_NO_MP4","video_sha256":null,"publication_approved":false}\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$archive/PRODUCTION_RUN.json"
          else
            python3 src/dog_run_evidence.py finalize output/dog output/evidence/review "$GITHUB_RUN_ID" \
              "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "${INSTALL_OUTCOME:-skipped}" "${RENDER_OUTCOME:-skipped}"
          fi
          cat "$archive/PRODUCTION_RUN.json" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$archive/TOP5_CONTACT_SHEET.jpg" ]] && grep -q '"status": "SUCCESS"' "$archive/PRODUCTION_RUN.json"; then
            echo 'verified=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Archive immutable run and attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dog-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/evidence/review/
          if-no-files-found: error
          retention-days: 30
      - name: Upload verified dog MP4 and evidence
        if: always() && steps.evidence.outputs.verified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dog-mp4-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/dog/TOP5_AUTO_V29_REVIEW_1080x1920.mp4
            output/dog/work/captions.ass
            output/dog/V32_TECHNICAL_QA.json
            output/dog/DOG_REPLACEMENT_READINESS.json
            output/dog/DOG_DISCOVERY_CANDIDATES.json
            output/dog/DOG_PIXABAY_CANDIDATES.json
            output/evidence/review/
          if-no-files-found: error
          retention-days: 30
      - name: Require a validated production output
        if: always()
        env:
          VERIFIED: ${{ steps.evidence.outputs.verified }}
        run: test "$VERIFIED" = true

      - name: Rehearse production evidence persistence against isolated Git
        if: github.event_name == 'pull_request'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          workspace="$PWD"
          archive="$workspace/output/evidence/review/runs/$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          sandbox="$(mktemp -d)"
          git init --bare "$sandbox/origin.git"
          git init "$sandbox/checkout"
          git -C "$sandbox/checkout" -c user.name=rehearsal -c user.email=rehearsal@example.invalid \
            commit --allow-empty -m rehearsal
          git -C "$sandbox/checkout" remote add origin "$sandbox/origin.git"
          cd "$sandbox/checkout"
          writer="$workspace/scripts/persist_dog_evidence.sh"
          recorder="$workspace/src/dog_run_evidence.py"
          bash "$writer" "$archive" "$sandbox/first" "$recorder"
          # Use a later attempt of this run to prove that it only moves latest_attempt.
          later=$((GITHUB_RUN_ATTEMPT+1))
          python3 "$recorder" finalize "$sandbox/no-output" "$sandbox/failed" \
            "$GITHUB_RUN_ID" "$later" "$GITHUB_SHA" success failure
          git worktree remove "$sandbox/first"
          bash "$writer" "$sandbox/failed/runs/$GITHUB_RUN_ID/attempt-$later" "$sandbox/second" "$recorder"
          cd "$workspace"
          mkdir -p output/persistence-rehearsal
          for pointer in latest_attempt latest_success; do
            git --git-dir="$sandbox/origin.git" show "top5-review-evidence:review/$pointer/PRODUCTION_RUN.json" \
              > "output/persistence-rehearsal/$pointer.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("output/persistence-rehearsal")
          attempt = json.loads((root/"latest_attempt.json").read_text())
          success = json.loads((root/"latest_success.json").read_text())
          assert attempt["status"] == "MP4_NOT_CREATED"
          assert success["status"] == "SUCCESS"
          assert attempt["run_attempt"] == success["run_attempt"] + 1
          assert success["video_sha256"] and attempt["video_sha256"] is None
          PY
      - name: Upload isolated persistence evidence
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v4
        with:
          name: dog-persistence-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/persistence-rehearsal/
          if-no-files-found: error
          retention-days: 30

  persist-evidence:
    needs: build
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dog-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming
      - name: Advance evidence pointers on the dedicated branch
        env:
          BUILD_OUTCOME: ${{ needs.build.result }}
        shell: bash
        run: |
          set -euo pipefail
          source_archive="$PWD/incoming/runs/$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          if [[ ! -f "$source_archive/PRODUCTION_RUN.json" ]] || { [[ "$BUILD_OUTCOME" != success ]] && grep -q '"status": "SUCCESS"' "$source_archive/PRODUCTION_RUN.json"; }; then
            work="$RUNNER_TEMP/dog-fallback-review"
            python3 src/dog_run_evidence.py finalize "$RUNNER_TEMP/no-dog-output" "$work" \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$BUILD_OUTCOME" skipped
            source_archive="$work/runs/$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          fi
          bash scripts/persist_dog_evidence.sh "$source_archive" \
            "$RUNNER_TEMP/dog-evidence-branch" "$PWD/src/dog_run_evidence.py"
