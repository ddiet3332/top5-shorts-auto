      - name: Publish binary-safe textual frame previews for independent visual review
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // GitHub's connected text reader cannot decode raw JPEG bytes.
            // Store a bounded JPEG as ASCII base64, retrievable as UTF-8.
            // This is visual evidence only; never an editorial or rights pass.
            const fs=require('fs');
            const crypto=require('crypto');
            const {owner,repo}=context.repo;
            const previews=[
              ['TOP5_CONTACT_SHEET.jpg','TOP5_CONTACT_SHEET_BASE64.txt'],
              ['RANK_BOUNDARY_CONTACT_SHEET.jpg','RANK_BOUNDARY_BASE64.txt']
            ];
            for(const [sourceName,destName] of previews){
              const source='output/top5_review_light/'+sourceName;
              if(!fs.existsSync(source)){core.warning('Missing visual evidence: '+source);continue;}
              const bytes=fs.readFileSync(source);
              if(bytes.length>1500000){core.warning('Visual evidence too large: '+source);continue;}
              const dest='review/latest/'+destName;
              const content=bytes.toString('base64')+'\\n';
              let sha;
              try{const old=await github.rest.repos.getContent({owner,repo,path:dest});sha=old.data.sha;}
              catch(e){if(e.status!==404)throw e;}
              await github.rest.repos.createOrUpdateFileContents({owner,repo,path:dest,sha,
                content:Buffer.from(content,'utf8').toString('base64'),
                message:'chore: publish text-readable dog visual evidence [skip ci]',
                branch:context.payload.repository.default_branch});
              core.info(dest+' jpeg_sha256='+crypto.createHash('sha256').update(bytes).digest('hex')+
                ' run_id='+context.runId);
            }
