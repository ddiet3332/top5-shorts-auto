name: TOP5 30-minute watchdog
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: top5-30min-watchdog
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify publication gates
        run: python -m unittest discover -s tests -p 'test_top5_publication_gate.py' -v
      - name: Inspect dog TOP5 pipeline and retry failed runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          run_json=$(gh api "repos/$GH_REPO/actions/runs/43969794527")
          workflow_id=$(jq -r '.workflow_id' <<<"$run_json")
          runs=$(gh api "repos/$GH_REPO/actions/workflows/$workflow_id/runs?per_page=15")
          active=$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting")] | length' <<<"$runs")
          if (( active > 0 )); then
            echo 'Dog pipeline active; no duplicate launch.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          latest=$(jq -c '.workflow_runs[0] // empty' <<<"$runs")
          if [[ -z "$latest" ]]; then
            echo 'No history; fail closed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          conclusion=$(jq -r '.conclusion' <<<"$latest")
          id=$(jq -r '.id' <<<"$latest")
          attempt=$(jq -r '.run_attempt' <<<"$latest")
          echo "Run $id: $conclusion, attempt $attempt" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$conclusion" == success ]]; then
            echo 'Technical run succeeded. Checking review evidence (never infer scores).' >> "$GITHUB_STEP_SUMMARY"
            artifacts=$(gh api "repos/$GH_REPO/actions/runs/$id/artifacts?per_page=100")
            artifact_id=$(jq -r '[.artifacts[] | select(.name | startswith("TOP5-dog_surprises-review-"))] | sort_by(.created_at) | last | .id // empty' <<<"$artifacts")
            if [[ -z "$artifact_id" ]]; then
              echo 'No dog review artifact: quality unknown.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            mkdir -p /tmp/top5-watchdog
            gh api "repos/$GH_REPO/actions/artifacts/$artifact_id/zip" > /tmp/top5-watchdog/review.zip
            unzip -oq /tmp/top5-watchdog/review.zip -d /tmp/top5-watchdog/review
            python - <<'PY'
import json,os
from pathlib import Path
p=Path('/tmp/top5-watchdog/review/topic_run/V30_CREATIVE_AND_RIGHTS_GATES.json')
summary=Path(os.environ['GITHUB_STEP_SUMMARY'])
if not p.exists():
    summary.open('a').write('Missing quality/rights report; fail closed.\\n')
else:
    d=json.loads(p.read_text())
    if d.get('quality_target_75_met') is None or d.get('copyright_and_ypp_verified') is not True:
        summary.open('a').write('Quality score unverified and/or rights not cleared; NO 80-point claim, NO publication.\\n')
    else:
        summary.open('a').write('Evidence requires independent review before any 80+ claim.\\n')
PY
            exit 0
          fi
          if [[ "$conclusion" != failure && "$conclusion" != timed_out ]]; then
            echo 'Manual review required.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if (( attempt >= 4 )); then
            echo 'Three retries exhausted.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          gh api -X POST "repos/$GH_REPO/actions/runs/$id/rerun-failed-jobs" >/dev/null
          echo 'Retry requested; no publishing.' >> "$GITHUB_STEP_SUMMARY"
