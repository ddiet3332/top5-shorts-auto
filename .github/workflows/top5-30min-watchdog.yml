name: TOP5 30-minute watchdog
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/actions/setup-video-tools/**'
      - '.github/workflows/top5-30min-watchdog.yml'
      - 'src/top5_watchdog_*.py'
permissions:
  actions: write
  contents: read
concurrency:
  group: top5-30min-watchdog
  cancel-in-progress: false
jobs:
  check-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -p 'test_top5_watchdog*.py' -v
      - uses: ./.github/actions/setup-video-tools
        with:
          fonts: 'false'
      - name: PR 브랜치에서 운영 실행 조회 연동 확인
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOP5_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TOP5_WATCHDOG_READ_ONLY: '1'
        run: python src/top5_watchdog_artifacts.py
  inspect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Verify publication gates
        run: python -m unittest discover -s tests -p 'test_top5_publication_gate.py' -v
      - name: Compile all gate and repair modules
        run: python -m compileall -q src/top5_publication_gate.py src/top5_watchdog_decision.py src/top5_remediation.py src/top5_auto_v32.py
      - name: Verify scene replacement tests
        run: python -m unittest discover -s tests -p 'test_top5_remediation.py' -v
      - name: Verify watchdog decisions
        run: python -m unittest discover -s tests -p 'test_top5_watchdog_decision.py' -v
      - uses: ./.github/actions/setup-video-tools
        with:
          fonts: 'false'
      - name: 제작 실행 및 MP4·QA Artifact 검사
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOP5_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python src/top5_watchdog_artifacts.py
