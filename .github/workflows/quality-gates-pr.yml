name: Quality gates PR tests
on:
  pull_request:
    paths:
      - 'src/quality_gates.py'
      - 'src/qualified_selection.py'
      - 'tests/test_quality_gates.py'
      - 'tests/test_qualified_selection.py'
      - 'config/gates.json'
      - '.github/workflows/quality-gates-pr.yml'
  workflow_dispatch:
jobs:
  quality-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_quality_gates.py tests/test_qualified_selection.py
