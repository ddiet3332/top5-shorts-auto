name: TOP5 production validation
on:
  push:
    paths:
      - '.github/workflows/top5-production-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: top5-production-validation
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TOPIC: dog_surprises
    steps:
      - uses: actions/checkout@v4
      - name: Install video dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-nanum fonts-noto-cjk
          python3 -m venv /tmp/top5-validation
          /tmp/top5-validation/bin/pip install -q numpy pillow
      - name: Compile and test quality/repair gates
        run: |
          /tmp/top5-validation/bin/python -m compileall -q src/top5_auto_v32.py src/top5_remediation.py src/top5_publication_gate.py
          /tmp/top5-validation/bin/python -m unittest discover -s tests -p 'test_top5_remediation.py' -v
          /tmp/top5-validation/bin/python -m unittest discover -s tests -p 'test_top5_publication_gate.py' -v
          /tmp/top5-validation/bin/python -m unittest discover -s tests -p 'test_top5_auto_v32.py' -v
      - name: Download real dog source audition
        run: /tmp/top5-validation/bin/python src/v37_dog_audition.py
      - name: Verify source review manifest exists
        run: test -f output/dog_audition/DOG_AUDITION.json
      - name: Build actual review MP4
        run: /tmp/top5-validation/bin/python src/top5_auto_v32.py --topic "$TOPIC" --output output/topic_run
      - name: Verify full video and audio decoding
        run: ffmpeg -hide_banner -v error -xerror -i output/topic_run/TOP5_AUTO_V29_REVIEW_1080x1920.mp4 -map 0:v:0 -map 0:a:0 -f null -
      - name: Record unverified quality and rights without fabricating scores
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "src")
          from top5_publication_gate import evaluate
          root=Path("output/topic_run")
          qa=root/"editorial_qa.json"
          rights=root/"independent_rights_review.json"
          read=lambda p: json.loads(p.read_text()) if p.is_file() else {}
          result=evaluate(read(qa),read(rights),root/"TOP5_AUTO_V29_REVIEW_1080x1920.mp4")
          (root/"PUBLICATION_GATE.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+chr(10))
          print("Score verified:",result["score_verified"],"80+:",result["report_80"],"Rights:",result["rights_gate_passed"])
          PY
      - name: Automatically score the actual MP4 (technical QA only)
        run: |
          /tmp/top5-validation/bin/python src/top5_automated_qa.py \
            --video output/topic_run/TOP5_AUTO_V29_REVIEW_1080x1920.mp4 \
            --technical output/topic_run/V32_TECHNICAL_QA.json \
            --manifest output/topic_run/TOP5_REPLACEMENT_REVIEW_INPUT.json \
            --output output/topic_run/TOP5_AUTOMATED_QA_SCORE.json
      - name: Upload review-only result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TOP5-dog-production-validation-${{ github.run_number }}
          path: output/topic_run/
          retention-days: 7
          if-no-files-found: warn
