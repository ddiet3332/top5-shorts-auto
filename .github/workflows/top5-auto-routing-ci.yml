      - 'src/top5_smolvlm2_editorial.py'
      - 'tests/test_top5_smolvlm2_editorial.py'
      - 'tests/test_top5_standard_scene_review.py'
      - 'src/top5_candidate_visual_gate.py'
      - 'tests/test_top5_object_diversity.py'
      - 'tests/test_top5_candidate_visual_gate.py'
      - 'tests/test_v52_nature_event_diversity.py'
      - 'sample/top5_auto_topics_v30.json'
      - 'review/top5_weak_source_windows.json'
      - 'tests/test_top5_reviewed_weak_windows.py'
      - 'src/top5_reviewed_action_captions.py'
      - 'review/top5_reviewed_action_stories.json'
      - 'tests/test_top5_reviewed_action_captions.py'
      - 'src/top5_auto_v29.py'
      - 'src/top5_auto_v32.py'
      - 'src/top5_nature_rank_repair.py'
      - 'review/top5_v56_nature_rank_evidence.json'
      - 'tests/test_top5_nature_rank_repair.py'
      - 'src/top5_artifact_resolver.py'
      - 'src/top5_production_review.py'
      - 'tests/test_top5_exact_frame_render.py'
      - 'src/v31_semantic_qa.py'
      - 'tests/test_top5_generic_label_safety.py'
      - 'tests/test_top5_category_rotation.py'
      - 'tests/test_top5_artifact_resolver.py'
      - 'tests/test_v31_semantic_qa.py'
      - 'tests/test_v31_topic_repair.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/top5-auto-routing-ci.yml'
      - '.github/workflows/top5_topic_production.yml'
      - 'src/topic_discovery_audit.py'
      - 'src/top5_all_source_license_audit.py'
      - 'review/top5_source_license_observations.json'
      - 'tests/test_top5_all_source_license_audit.py'
      - 'src/top5_topic_recovery.py'
      - 'tests/test_topic_discovery_audit.py'
      - 'tests/test_top5_topic_recovery.py'
      - 'tests/test_top5_topic_workflow_policy.py'
      - 'src/top5_auto_v30.py'
      - 'tests/test_v55_nature_source_span.py'
      - 'tests/test_v56_river_overflow_nature.py'
      - 'src/top5_provider_failure_gate.py'
      - 'tests/test_v53_provider_errors.py'
      - 'src/top5_standard_scene_review.py'
      - 'src/top5_original_frame_evidence.py'
      - 'tests/test_top5_original_frame_evidence.py'
      - 'src/top5_smolvlm2_editorial.py'
      - 'tests/test_top5_smolvlm2_editorial.py'
      - 'tests/test_top5_standard_scene_review.py'
      - 'src/top5_candidate_visual_gate.py'
      - 'tests/test_top5_object_diversity.py'
      - 'tests/test_top5_candidate_visual_gate.py'
      - 'tests/test_v52_nature_event_diversity.py'
      - 'sample/top5_auto_topics_v30.json'
      - 'review/top5_weak_source_windows.json'
      - 'tests/test_top5_reviewed_weak_windows.py'
      - 'src/top5_reviewed_action_captions.py'
      - 'review/top5_reviewed_action_stories.json'
      - 'tests/test_top5_reviewed_action_captions.py'
      - 'src/top5_auto_v29.py'
      - 'src/top5_auto_v32.py'
      - 'src/top5_nature_rank_repair.py'
      - 'review/top5_v56_nature_rank_evidence.json'
      - 'tests/test_top5_nature_rank_repair.py'
      - 'src/top5_artifact_resolver.py'
      - 'src/top5_production_review.py'
      - 'tests/test_top5_exact_frame_render.py'
      - 'src/v31_semantic_qa.py'
      - 'tests/test_top5_generic_label_safety.py'
      - 'tests/test_top5_category_rotation.py'
      - 'tests/test_top5_artifact_resolver.py'
      - 'tests/test_v31_semantic_qa.py'
      - 'tests/test_v31_topic_repair.py'
permissions:
  contents: read
jobs:
  topic-routing-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-video.txt
      - name: Install same generic Python dependencies
        run: python -m pip install -r requirements-video.txt
      - name: Verify manual and auto topic routing
        run: |
          python -m unittest discover -s tests -p 'test_topic_discovery_audit.py' -v
          python -m unittest discover -s tests -p 'test_top5_topic_recovery.py' -v
          python -m unittest discover -s tests -p 'test_v53_provider_errors.py' -v
          python -m unittest discover -s tests -p 'test_top5_all_source_license_audit.py' -v
          python -m unittest discover -s tests -p 'test_top5_topic_workflow_policy.py' -v
          python -m unittest discover -s tests -p 'test_top5_generic_label_safety.py' -v
          python -m unittest discover -s tests -p 'test_top5_category_rotation.py' -v
          python -m unittest discover -s tests -p 'test_top5_reviewed_weak_windows.py' -v
          python -m unittest discover -s tests -p 'test_top5_reviewed_action_captions.py' -v
          python -m unittest discover -s tests -p 'test_top5_nature_rank_repair.py' -v
          python -m unittest discover -s tests -p 'test_top5_candidate_visual_gate.py' -v
          python -m unittest discover -s tests -p 'test_v52_nature_event_diversity.py' -v
          python -m unittest discover -s tests -p 'test_v55_nature_source_span.py' -v
          python -m unittest discover -s tests -p 'test_v56_river_overflow_nature.py' -v
          python -m unittest discover -s tests -p 'test_top5_object_diversity.py' -v
          python -m unittest discover -s tests -p 'test_top5_artifact_resolver.py' -v
          python -m unittest discover -s tests -p 'test_top5_exact_frame_render.py' -v
          python -m unittest discover -s tests -p 'test_v31_semantic_qa.py' -v
          python -m unittest discover -s tests -p 'test_v31_topic_repair.py' -v
          python -m unittest discover -s tests -p 'test_top5_standard_scene_review.py' -v
          python -m unittest discover -s tests -p 'test_top5_original_frame_evidence.py' -v
          python -m unittest discover -s tests -p 'test_top5_smolvlm2_editorial.py' -v
# This CI only validates routing. Full videos and rights review are separate.
