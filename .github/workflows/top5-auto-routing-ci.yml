name: TOP5 automatic topic routing CI
on:
  pull_request:
    paths:
      - '.github/workflows/top5-auto-routing-ci.yml'
      - '.github/workflows/top5_topic_production.yml'
      - 'src/topic_discovery_audit.py'
      - 'tests/test_topic_discovery_audit.py'
      - 'tests/test_top5_topic_workflow_policy.py'
      - 'src/top5_auto_v30.py'
      - 'src/top5_auto_v29.py'
      - 'src/top5_auto_v32.py'
      - 'src/top5_artifact_resolver.py'
      - 'src/v31_semantic_qa.py'
      - 'tests/test_top5_generic_label_safety.py'
      - 'tests/test_top5_category_rotation.py'
      - 'tests/test_top5_artifact_resolver.py'
      - 'tests/test_v31_semantic_qa.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/top5-auto-routing-ci.yml'
      - '.github/workflows/top5_topic_production.yml'
      - 'src/topic_discovery_audit.py'
      - 'tests/test_topic_discovery_audit.py'
      - 'tests/test_top5_topic_workflow_policy.py'
      - 'src/top5_auto_v30.py'
      - 'src/top5_auto_v29.py'
      - 'src/top5_auto_v32.py'
      - 'src/top5_artifact_resolver.py'
      - 'src/v31_semantic_qa.py'
      - 'tests/test_top5_generic_label_safety.py'
      - 'tests/test_top5_category_rotation.py'
      - 'tests/test_top5_artifact_resolver.py'
      - 'tests/test_v31_semantic_qa.py'
permissions:
  contents: read
jobs:
  topic-routing-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-video.txt
      - name: Install same generic Python dependencies
        run: python -m pip install -r requirements-video.txt
      - name: Verify manual and auto topic routing
        run: |
          python -m unittest discover -s tests -p 'test_topic_discovery_audit.py' -v
          python -m unittest discover -s tests -p 'test_top5_topic_workflow_policy.py' -v
          python -m unittest discover -s tests -p 'test_top5_generic_label_safety.py' -v
          python -m unittest discover -s tests -p 'test_top5_category_rotation.py' -v
          python -m unittest discover -s tests -p 'test_top5_artifact_resolver.py' -v
          python -m unittest discover -s tests -p 'test_v31_semantic_qa.py' -v
# This CI only validates routing. Full videos and rights review are separate.
