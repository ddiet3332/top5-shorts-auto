name: TOP5 automatic topic routing CI
on:
  pull_request:
    paths:
      - '.github/workflows/top5-auto-routing-ci.yml'
      - '.github/workflows/top5_topic_production.yml'
      - 'src/topic_discovery_audit.py'
      - 'src/top5_all_source_license_audit.py'
      - 'review/top5_source_license_observations.json'
      - 'tests/test_top5_all_source_license_audit.py'
      - 'src/top5_topic_recovery.py'
      - 'tests/test_topic_discovery_audit.py'
      - 'tests/test_top5_topic_recovery.py'
      - 'tests/test_top5_topic_workflow_policy.py'
      - 'src/top5_auto_v30.py'
      - 'tests/test_v55_nature_source_span.py'
