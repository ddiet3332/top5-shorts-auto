name: Free gate CLI smoke test (no paid APIs)
on:
  pull_request:
    paths:
      - 'src/run_local_gates.py'
      - 'src/free_gate_runner.py'
      - '.github/workflows/free-gate-cli-pr.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy opencv-python-headless pytest
      - name: Check CLI missing rights and models fail closed
        run: |
          printf '[{"id":"demo","provider":"pexels","source_page":"https://example.com","local_path":"/tmp/missing.mp4"}]' > /tmp/candidates.json
          set +e
          python -m src.run_local_gates --candidates /tmp/candidates.json --output /tmp/evidence.json --dog-weights /tmp/missing.pt
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json
          r=json.load(open('/tmp/evidence.json'))
          assert r['qualified_count']==0
          assert r['publication_approved'] is False
          assert r['candidates'][0]['reject_code']=='REJECT_RIGHTS_UNCLEAR'
          PY
      - run: python -m pytest -q tests/test_free_gate_runner.py tests/test_verified_v32_handoff.py
