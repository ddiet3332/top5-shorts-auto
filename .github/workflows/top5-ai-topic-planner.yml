name: TOP5 FREE automatic video review production
on:
  push:
    branches: [main]
    paths:
      - '.github/top5-run-request.txt'
  pull_request:
    paths:
      - '.github/workflows/top5-ai-topic-planner.yml'
      - 'src/top5_*.py'
      - 'src/v25_audio_remaster.py'
      - 'tests/test_top5_*.py'
  schedule:
    - cron: '0 0 * * *'  # 09:00 Asia/Seoul
    - cron: '0 9 * * *'  # 18:00 Asia/Seoul
  workflow_dispatch:
    inputs:
      slot:
        description: 'AM or PM'
        type: choice
        options: [AM, PM]
        required: true
permissions:
  contents: read
  issues: write
concurrency:
  group: top5-topic-planner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo 'FFmpeg is not preinstalled on this fresh runner; installing with bounded network retries'
            timeout 75s sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 || echo 'apt index refresh timed out; using available indexes'
            timeout 360s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          python3 -c 'import PIL, numpy' || timeout 60s python3 -m pip install --break-system-packages Pillow numpy
          FONT=/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf
          if [ ! -s "$FONT" ]; then
            sudo mkdir -p /usr/share/fonts/truetype/nanum
            curl --fail --location --retry 2 --connect-timeout 8 --max-time 45 --silent --show-error \
              https://raw.githubusercontent.com/google/fonts/main/ofl/nanumgothic/NanumGothic-Bold.ttf \
              -o /tmp/NanumGothicBold.ttf
            test "$(stat -c%s /tmp/NanumGothicBold.ttf)" -gt 100000
            sudo cp /tmp/NanumGothicBold.ttf "$FONT"
          fi
          test -s "$FONT"
          ffmpeg -version | head -n 1
      - name: Resolve scheduled slot
        id: slot
        env:
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          if [ -n "$INPUT_SLOT" ]; then SLOT="$INPUT_SLOT"; elif [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then SLOT=AM; else SLOT=PM; fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
      - name: Read previous topic selections from tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            echo '[]' > topic_history.json
            exit 0
          fi
          gh api --paginate "repos/${{ github.repository }}/issues/18/comments?per_page=100" --jq '.[] | select(.body | startswith("TOP5_TOPIC_HISTORY ")) | .body | ltrimstr("TOP5_TOPIC_HISTORY ") | fromjson' | jq -s '.' > topic_history.json
      - name: Run free planner tests
        run: python3 -m unittest discover -s tests -p 'test_top5_free_topic_planner.py'
      - name: Run generic preflight tests
        run: python3 -m unittest discover -s tests -p 'test_top5_free_footage_preflight.py'
      - name: Plan free topic (no footage or publishing)
        run: python3 src/top5_free_topic_planner.py --slot "${{ steps.slot.outputs.slot }}" --trends
      - name: Check real stock footage availability (metadata only)
        continue-on-error: true
        if: github.event_name != 'pull_request'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python3 src/top5_free_footage_preflight.py
      - name: Test public video discovery adapters
        run: python3 -m unittest discover -s tests -p test_top5_public_video_discovery.py
      - name: Search Wikimedia Commons and Internet Archive for source candidates
        run: python3 src/top5_public_video_discovery.py
      - name: Test topic relevance hard gate
        run: python3 -m unittest discover -s tests -p test_top5_topic_relevance_gate.py
      - name: Probe real Wikimedia and Internet Archive video downloads and full decoding
        continue-on-error: true
        run: python3 src/top5_public_video_download_probe.py
      - name: Test downloaded source gate
        run: python3 -m unittest discover -s tests -p 'test_top5_free_source_download.py'
      - name: Verify production review and repair tests
        run: python3 -m unittest discover -s tests -p test_top5_production_review.py
      - name: Download and decode 5 distinct sources
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 src/top5_free_source_download.py --topic-attempts 3
      - name: Generate visual review contact sheet from real source frames
        run: python3 src/top5_source_contact_sheet.py
      - name: Generate source-linked manual review worksheet
        run: python3 src/top5_source_review_worksheet.py
      - name: Test source review worksheet
        run: python3 -m unittest discover -s tests -p test_top5_source_review_worksheet.py
      - name: Test metadata-based Korean captions
        run: python3 -m unittest discover -s tests -p test_top5_metadata_captions.py
      - name: Test reviewed-caption source matching
        run: python3 -m unittest discover -s tests -p test_top5_reviewed_captions.py
      - name: Test source fingerprint review bridge
        run: python3 -m unittest discover -s tests -p test_top5_review_registry_bridge.py
      - name: Resolve previously human-reviewed source fingerprints into this run
        run: python3 src/top5_review_registry_bridge.py
      - name: Require actual source visual review before rendering
        id: render_gate
        run: python3 src/top5_render_review_gate.py
      - name: 검토용 MP4 제작 및 기술 검수
        env:
          REVIEW_APPROVED: ${{ steps.render_gate.outputs.approved }}
          TOP5_MAX_REPAIRS: ${{ vars.TOP5_MAX_REPAIRS || '3' }}
        run: |
          args=()
          if [[ "$REVIEW_APPROVED" == true ]]; then
            args+=(--reviewed-captions reviewed_top5_captions.json)
          fi
          if [[ -f review/production_editorial_review.json ]]; then
            args+=(--editorial-review review/production_editorial_review.json)
          fi
          if [[ -f review/production_rights_review.json ]]; then
            args+=(--rights-review review/production_rights_review.json)
          fi
          python3 src/top5_generic_v06_preview.py "${args[@]}"
          python3 src/top5_independent_review_qa.py
      - name: 제작 결과 요약
        if: always()
        run: |
          if [[ -f output/top5_v06_review/QA.md ]]; then
            cat output/top5_v06_review/QA.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## TOP5 제작 중단 · MP4 없음' >> "$GITHUB_STEP_SUMMARY"
            if [[ -f output/top5_source_qa/SOURCE_DOWNLOAD_QA.json ]]; then
              jq -r '.topic_attempts[] | "- \(.topic) · 원본 \(.downloaded_valid_sources)/5"' output/top5_source_qa/SOURCE_DOWNLOAD_QA.json >> "$GITHUB_STEP_SUMMARY"
            fi
            mkdir -p output/top5_v06_review
            cp "$GITHUB_STEP_SUMMARY" output/top5_v06_review/QA.md
          fi
      - name: Save selection for next slot
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '{date,slot,topic:.selected.topic,category:.selected.category}' output/topic_plan.json | sed 's/^/TOP5_TOPIC_HISTORY /' > /tmp/topic_history_comment.txt
          gh issue comment 18 --repo "${{ github.repository }}" --body-file /tmp/topic_history_comment.txt
      - name: Upload topic plan
        id: review_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top5-topic-plan-${{ steps.slot.outputs.slot }}-${{ github.run_attempt }}
          path: |
            output/topic_plan.json
            output/topic_footage_preflight.json
            output/top5_external_sources/DISCOVERY.json
            output/top5_external_sources/probe/PUBLIC_VIDEO_DOWNLOAD_QA.json
            output/top5_source_qa/SOURCE_DOWNLOAD_QA.json
            output/top5_visual_review/TOP5_SOURCE_CONTACT_SHEET.jpg
            output/top5_visual_review/TOP5_TEMPORAL_9FRAMES_PER_SOURCE.jpg
            output/top5_visual_review/VISUAL_REVIEW_MANIFEST.json
            output/top5_visual_review/SOURCE_REVIEW_WORKSHEET.json
            output/top5_visual_review/RENDER_GATE.json
            output/top5_v06_review/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: 휴대폰 다운로드 링크
        if: always() && steps.review_artifact.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.review_artifact.outputs.artifact-url }}
        run: echo "[GitHub 로그인 후 검토 ZIP 다운로드]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
