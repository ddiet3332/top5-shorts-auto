name: TOP5 FREE automatic video review production
on:
  push:
    branches: [main]
    paths:
      - '.github/top5-run-request.txt'
  schedule:
    - cron: '0 0 * * *'  # 09:00 Asia/Seoul
    - cron: '0 9 * * *'  # 18:00 Asia/Seoul
  workflow_dispatch:
    inputs:
      slot:
        description: 'AM or PM'
        type: choice
        options: [AM, PM]
        required: true
permissions:
  contents: read
  issues: write
concurrency:
  group: top5-topic-planner
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-nanum && python3 -m pip install --break-system-packages Pillow
      - name: Resolve scheduled slot
        id: slot
        env:
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          if [ -n "$INPUT_SLOT" ]; then SLOT="$INPUT_SLOT"; elif [ "$(date -u +%H)" = "00" ]; then SLOT=AM; else SLOT=PM; fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
      - name: Read previous topic selections from tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/issues/18/comments?per_page=100" --jq '.[] | select(.body | startswith("TOP5_TOPIC_HISTORY ")) | .body | ltrimstr("TOP5_TOPIC_HISTORY ") | fromjson' | jq -s '.' > topic_history.json
      - name: Run free planner tests
        run: python3 -m unittest discover -s tests -p 'test_top5_free_topic_planner.py'
      - name: Run generic preflight tests
        run: python3 -m unittest discover -s tests -p 'test_top5_free_footage_preflight.py'
      - name: Plan free topic (no footage or publishing)
        run: python3 src/top5_free_topic_planner.py --slot "${{ steps.slot.outputs.slot }}"
      - name: Check real stock footage availability (metadata only)
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python3 src/top5_free_footage_preflight.py
      - name: Test downloaded source gate
        run: python3 -m unittest discover -s tests -p 'test_top5_free_source_download.py'
      - name: Download and decode 5 distinct sources
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python3 src/top5_free_source_download.py
      - name: Generate visual review contact sheet from real source frames
        run: python3 src/top5_source_contact_sheet.py
      - name: Test metadata-based Korean captions
        run: python3 -m unittest discover -s tests -p test_top5_metadata_captions.py
      - name: Test reviewed-caption source matching
        run: python3 -m unittest discover -s tests -p test_top5_reviewed_captions.py
      - name: Require actual source visual review before rendering
        run: python3 src/top5_render_review_gate.py
      - name: Render V06 human-reviewed video
        run: python3 src/top5_generic_v06_preview.py --reviewed-captions reviewed_top5_captions.json
      - name: Test 75-point editorial threshold
        run: python3 -m unittest discover -s tests -p test_top5_75_threshold.py
      - name: Test hard source diversity gate
        run: python3 -m unittest discover -s tests -p test_top5_source_diversity_gate.py
      - name: Independently validate rendered video and flag editorial risks
        run: python3 src/top5_independent_review_qa.py
      - name: Save selection for next slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '{date,slot,topic:.selected.topic,category:.selected.category}' output/topic_plan.json | sed 's/^/TOP5_TOPIC_HISTORY /' > /tmp/topic_history_comment.txt
          gh issue comment 18 --repo "${{ github.repository }}" --body-file /tmp/topic_history_comment.txt
      - name: Upload topic plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top5-topic-plan-${{ steps.slot.outputs.slot }}
          path: |
            output/topic_plan.json
            output/topic_footage_preflight.json
            output/top5_source_qa/SOURCE_DOWNLOAD_QA.json
            output/top5_source_qa/source_*.mp4
            output/top5_visual_review/TOP5_SOURCE_CONTACT_SHEET.jpg
            output/top5_visual_review/VISUAL_REVIEW_MANIFEST.json
            output/top5_visual_review/RENDER_GATE.json
            output/top5_v06_review/TOP5_V06_GENERIC_REVIEW_25s.mp4
            output/top5_v06_review/GENERIC_V06_QA.json
            output/top5_v06_review/INDEPENDENT_REVIEW_QA.json
          if-no-files-found: warn
          retention-days: 14
