name: TOP5 universal four-family real video trials
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Choose one family topic or run all four'
        required: true
        type: choice
        default: all
        options:
          - all
          - cat_surprises
          - human_moments
          - objects_oddities
          - nature_moments
  pull_request:
    paths:
      - '.github/workflows/top5-universal-cross-category.yml'
      - 'src/top5_universal_trial.py'
      - 'src/top5_scene_evidence.py'
      - 'tests/test_top5_scene_evidence.py'
      - 'src/top5_universal_stock_fallback.py'
      - 'src/top5_production_review.py'
      - 'tests/test_top5_exact_frame_render.py'
      - 'tests/test_top5_universal_stock_fallback.py'
      - 'review/rejected_source_ids.json'
      - 'review/HUMAN_DANCE_ACTUAL_RENDERED_FRAME_REJECTION_2026-11-21.md'
      - 'tests/test_top5_universal_trial.py'
      - 'review/TOP5_UNIVERSAL_AUTOMATION_CHARTER_2026-11-21.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/top5-universal-cross-category.yml'
      - 'src/top5_universal_trial.py'
      - 'src/top5_scene_evidence.py'
      - 'tests/test_top5_scene_evidence.py'
      - 'src/top5_universal_stock_fallback.py'
      - 'src/top5_production_review.py'
      - 'tests/test_top5_exact_frame_render.py'
      - 'tests/test_top5_universal_stock_fallback.py'
      - 'review/rejected_source_ids.json'
      - 'review/HUMAN_DANCE_ACTUAL_RENDERED_FRAME_REJECTION_2026-11-21.md'
      - 'tests/test_top5_universal_trial.py'
      - 'review/TOP5_UNIVERSAL_AUTOMATION_CHARTER_2026-11-21.md'
      - 'src/top5_auto_v32.py'
      - 'src/top5_nature_rank_repair.py'
      - 'review/top5_v56_nature_rank_evidence.json'
      - 'tests/test_top5_nature_rank_repair.py'
      - 'review/top5_weak_source_windows.json'
      - 'tests/test_top5_reviewed_weak_windows.py'
      - 'src/top5_auto_v30.py'
      - 'tests/test_v58_hook_reserve_pool.py'
      - 'tests/test_v55_nature_source_span.py'
      - 'tests/test_v56_river_overflow_nature.py'
      - 'src/top5_provider_failure_gate.py'
      - 'tests/test_v53_provider_errors.py'
      - 'tests/test_top5_object_diversity.py'
      - 'src/top5_candidate_visual_gate.py'
      - 'tests/test_top5_candidate_visual_gate.py'
      - 'tests/test_v52_nature_event_diversity.py'
      - 'src/top5_reviewed_sources.py'
      - 'src/top5_auto_v29.py'
      - 'src/v28_fullscreen_builder.py'
      - 'tests/test_v44_exact_frames.py'
      - 'sample/top5_auto_topics_v30.json'
permissions:
  contents: read
concurrency:
  group: top5-universal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check-universal-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-video-tools
        with:
          fonts: 'true'
      - name: Confirm actual media tools for real EOF/frame regressions
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -1
      - name: Install image inspection dependency for test runner
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13' 'numpy>=1.26,<3'
      - name: Test all four channel families and publication hard gates
        run: |
          python -m unittest discover -s tests -p 'test_top5_universal_trial.py' -v
          python -m unittest discover -s tests -p 'test_v44_exact_frames.py' -v
          python -m unittest discover -s tests -p 'test_top5_universal_stock_fallback.py' -v
          python -m unittest discover -s tests -p 'test_top5_scene_evidence.py' -v
          python -m unittest discover -s tests -p 'test_top5_reviewed_weak_windows.py' -v
          python -m unittest discover -s tests -p 'test_top5_candidate_visual_gate.py' -v
          python -m unittest discover -s tests -p 'test_v52_nature_event_diversity.py' -v
          python -m unittest discover -s tests -p 'test_top5_object_diversity.py' -v
  cross-topic-real-mp4:
    needs: check-universal-contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        topic: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.topic != 'all' && format('["{0}"]', inputs.topic) || '["cat_surprises","human_moments","objects_oddities","nature_moments"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-video.txt
      - uses: ./.github/actions/setup-video-tools
      - name: Install generic production dependencies
        timeout-minutes: 6
        run: python -m pip install --disable-pip-version-check -r requirements-video.txt
      - name: Real original footage to distinct-topic review MP4
        id: trial
        timeout-minutes: 31
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python src/top5_universal_trial.py --topic "${{ matrix.topic }}" \
            --output "output/universal/${{ matrix.topic }}"
      - name: Generate 35 actual ranked video frames and independent editorial warnings
        if: steps.trial.outcome == 'success'
        timeout-minutes: 7
        run: |
          python src/top5_scene_evidence.py --topic "${{ matrix.topic }}" --output "output/universal/${{ matrix.topic }}"
      - name: Report real cross-topic status including source shortages
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          topic="${{ matrix.topic }}"
          out=Path("output/universal")/topic
          report=out/"UNIVERSAL_TOPIC_TRIAL.json"
          if report.exists():
              data=json.loads(report.read_text())
              lines=[f"### {topic} / {data['family']}",
                     f"- status: {data['status']}",
                     f"- technical MP4 verified: {data['technical_pass']}",
                     f"- whole video score: UNVERIFIED",
                     f"- rights/YPP: UNVERIFIED",
                     f"- publication approved: false"]
              lines.extend("- blocker: "+b for b in data.get("blockers",[]))
          else:
              lines=[f"### {topic} / CI or setup failure",
                     "- Trial report unavailable; do not claim a completed video."]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n".join(lines)+"\n")
          PY
      - name: Upload actual video, source and failure evidence (never publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TOP5-universal-${{ matrix.topic }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/universal/${{ matrix.topic }}/*.mp4
            output/universal/${{ matrix.topic }}/*.json
            output/universal/${{ matrix.topic }}/*.jpg
            output/universal/${{ matrix.topic }}/*.md
            output/universal/${{ matrix.topic }}/*.txt
            output/universal/${{ matrix.topic }}/stock_fallback/*.json
            output/universal/${{ matrix.topic }}/stock_fallback/*.txt
            output/universal/${{ matrix.topic }}/stock_fallback/sources/SOURCE_DOWNLOAD_QA.json
            output/universal/${{ matrix.topic }}/stock_fallback/render/GENERIC_V06_QA.json
            output/universal/${{ matrix.topic }}/stock_fallback/render/QA.md
          if-no-files-found: warn
          retention-days: 7
# YouTube auto-posting intentionally absent; 85+ actual editorial QA and per-source rights remain mandatory.
