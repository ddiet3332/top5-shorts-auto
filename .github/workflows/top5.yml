name: TOP5 CC Shorts - discover and draft
run-name: TOP5 V17.2 cat action source review - ${{ inputs.topic || 'cat actions' }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/top5.yml'
      - 'src/v17_discovery.py'
      - 'tests/test_v17_source_collection.py'
      - 'src/publish_review_index.py'
      - 'tests/test_review_index.py'
  workflow_dispatch:
    inputs:
      mode:
        description: 'review: 후보 검수 / selected-draft: 선정한 5개 편집 / draft: 자동 초안 / discover: 검색'
        required: true
        type: choice
        options:
          - v17-discover
          - v16-draft
          - v16-candidates
          - v15-draft
          - v15-short
          - v15-candidates
          - v14-draft
          - v13-draft
          - mixed-draft
          - source-audition
          - source-review
          - candidate-review
          - review
          - selected-draft
          - discover
          - draft
        default: v17-discover
      candidate_ids:
        description: '최대 3개 큐레이션된 Pexels 후보 ID (쉼표 구분)'
        required: false
        default: 'PX-4807151,PX-6853903,PX-6853188'
        type: string
      topic:
        description: '영어 검색 키워드 (예: cat playing / dog funny)'
        required: true
        default: 'cat playing'
        type: string
      title:
        description: '쇼츠 상단 한국어 제목'
        required: true
        default: '고양이 기상천외 행동 TOP5'
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-nanum fonts-noto-cjk
      - name: Validate ranking and licensing logic
        run: python3 -m unittest discover -s tests -v
      - name: Discover, download, and build draft
        env:
          MODE: ${{ inputs.mode || (github.event_name == 'push' && 'v17-discover' || 'source-audition') }}
          TOPIC: ${{ inputs.topic || 'cat playing' }}
          TITLE: ${{ inputs.title || '고양이 기상천외 행동 TOP5' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          V13_IDS: ${{ inputs.candidate_ids || 'PX-4807151,PX-6853903,PX-6853188' }}
        run: |
          if [ "$MODE" = "v17-discover" ]; then
            python3 src/v17_discovery.py --output output --limit 10
          elif [ "$MODE" = "v16-draft" ]; then
            python3 src/v12_mixed_draft.py --output output --selection sample/v16-mixed-selection.json --script sample/v16-script.json --title '고양이 돌발행동 TOP5' --v16-pacing
          elif [ "$MODE" = "v16-candidates" ]; then
            python3 src/v11_candidate_review.py --candidates sample/v16-candidates.json --output output
          elif [ "$MODE" = "v15-draft" ]; then
            python3 src/v12_mixed_draft.py --output output --selection sample/v15-mixed-selection.json --script sample/v15-script.json --title '고양이 돌발행동 TOP5' --v15-pacing
          elif [ "$MODE" = "v15-short" ]; then
            python3 src/v15_short_review.py
          elif [ "$MODE" = "v15-candidates" ]; then
            python3 src/v11_candidate_review.py --candidates sample/v15-candidates.json --output output
          elif [ "$MODE" = "v14-draft" ]; then
            python3 src/v12_mixed_draft.py --output output --selection sample/v14-mixed-selection.json --script sample/v14-script.json --title '고양이 돌발행동 TOP5'
          elif [ "$MODE" = "v13-draft" ]; then
            python3 src/v12_mixed_draft.py --output output --selection sample/v13-mixed-selection.json --script sample/v13-script.json
          elif [ "$MODE" = "mixed-draft" ]; then
            python3 src/v12_mixed_draft.py --output output
          elif [ "$MODE" = "source-audition" ]; then
            python3 src/v12_pexels_audition.py --output output --ids "$V13_IDS"
          elif [ "$MODE" = "source-review" ]; then
            if [ -n "$PEXELS_API_KEY" ]; then
              python3 src/v12_sources.py --output output --existing-pexels-api
            else
              python3 src/v12_sources.py --output output
            fi
          elif [ "$MODE" = "candidate-review" ]; then
            python3 src/v11_candidate_review.py --output output
          else
            python3 src/top5.py --output output
          fi
      - name: Create review summary for mobile QA
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('output/V17_CANDIDATE_AUDIT.json')
          if p.exists():
              a=json.loads(p.read_text(encoding='utf-8'))
              entries=a.get('candidates',[])
              lines=['# V17.2 candidate review — not approved for publishing','',
                  f"- Commons CC metadata pool: **{a.get('raw_license_filtered_pool',0)}**",
                  f"- Cat-relevant candidates (title/category evidence only): **{a.get('cat_relevance_pool',0)}**",
                  f"- Real short-video previews (up to 5 sec): **{sum(len(c.get('moments',[])) for c in entries)}**",
                  f"- Unique originals with previews: **{len(entries)}**",
                  "- Independently verified humor, copyright, and monetization approval: **0**",'',
                  '## Original candidate titles (manual video review required)','']
              for i,c in enumerate(entries,1):
                  title=str(c.get('title','')).replace('|','/').replace('\n',' ')
                  lines.append(f"{i}. {title} — {c.get('width','?')}x{c.get('height','?')} — {c.get('status','unknown')}")
              if not entries:
                  lines.append('No qualified video previews. Do not manufacture a TOP5.')
              lines+=['','*Action success means the software ran, not that the videos are suitable or licensed.*']
          else:
              lines=['# Candidate review','', 'V17 audit was not generated by this run. Check the workflow logs.']
          summary='\n'.join(lines)+'\n'
          Path('output').mkdir(exist_ok=True)
          Path('output/V17_QA_SUMMARY.md').write_text(summary,encoding='utf-8')
          p=os.environ.get('GITHUB_STEP_SUMMARY')
          if p:
              with open(p,'a',encoding='utf-8') as h:
                  h.write(summary)
          print(summary)
          PY
      - name: Upload MP4, candidates, attribution, rights review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TOP5-shorts-review-${{ github.run_number }}
          path: |
            output/TOP5_DRAFT_REVIEW_ONLY_1080x1920.mp4
            output/candidates.csv
            output/candidates.json
            output/selected_sources.json
            output/rejected.json
            output/YOUTUBE_CREDITS.txt
            output/RIGHTS_CHECKLIST.md
            output/SHOTLIST_FOR_REVIEW.json
            output/MOTION_RANKING_REPORT.json
            output/VOICEOVER_TIMELINE.json
            output/NARRATION_REQUIRED.md
            output/AUDIO_RIGHTS_REVIEW.md
            output/QA_CONTACT_SHEET.jpg
            output/QA_RANK1_FULL_SOURCE.mp4
            output/QA_V9_NEW_SOURCE_*.mp4
            output/REVIEW_ORIGINAL_GRID.jpg
            output/REVIEW_VERTICAL_GRID.jpg
            output/REVIEW_SHORTLIST.json
            output/REVIEW_GUIDE.md
            output/REVIEW_THUMBNAILS/*.jpg
            output/REVIEW_PREVIEWS/*.mp4
            output/V8_MOMENT_*_GRID.jpg
            output/V8_MOMENTS_REVIEW.json
            output/V8_EDITORIAL_GUIDE.md
            output/V11_CANDIDATE_REPORT.json
            output/V11_REVIEW_GUIDE.md
            output/V11_STORYBOARD_*.jpg
            output/V11_PREVIEWS/candidate_*.mp4
            output/V11_REACTION_SFX.json
            output/V12_MOBILE_REVIEW.html
            output/V12_SOURCE_REPORT.json
            output/V12_SOURCES.csv
            output/V12_RIGHTS_AND_EDITORIAL.md
            output/V12_PEXELS_AUDITION.json
            output/V12_PEXELS_AUDITION.md
            output/V12_PEXELS_FRAMES/*.jpg
            output/V12_PEXELS_PREVIEWS/*.mp4
            output/V12_MIXED_RIGHTS_AUDIT.json
            output/V15_SHORT_PREVIEW.mp4
            output/V15_SHORT_AUDIT.json
            output/V17_CONTACT_SHEET.jpg
            output/V17_CANDIDATE_AUDIT.json
            output/V17_REVIEW_QUEUE.csv
            output/V17_EDITORIAL_QUEUE.md
            output/V17_QA_SUMMARY.md
            output/V17_PREVIEWS/V17_*.mp4
            output/V17_FRAMES/V17_*_M*.jpg
          if-no-files-found: warn
          retention-days: 7

  # Only this lightweight job receives write permission.
  # Published index contains metadata and run IDs, NEVER preview MP4 bytes.
  publish_review_index:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download same-run candidate audit (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: TOP5-shorts-review-${{ github.run_number }}
          path: output
      - name: Write latest review run pointer to repository
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git checkout --quiet -B review-index origin/main
            python3 src/publish_review_index.py \
              --audit output/V17_CANDIDATE_AUDIT.json \
              --repo "$GITHUB_REPOSITORY" \
              --run-id "$GITHUB_RUN_ID" \
              --run-number "$GITHUB_RUN_NUMBER" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --result "$BUILD_RESULT" \
              --event "$GITHUB_EVENT_NAME"
            git add -A review/
            if git diff --cached --quiet; then
              echo "No index update needed (a newer run may already exist)."
              exit 0
            fi
            git commit -m "index: actions review run $GITHUB_RUN_NUMBER [$GITHUB_RUN_ID]"
            if git push origin HEAD:main; then
              echo "Latest run index available at review/latest.json"
              exit 0
            fi
            echo "Concurrent update detected; retrying index commit $attempt/3"
          done
          echo "Could not push review/latest.json after three attempts" >&2
          exit 1
