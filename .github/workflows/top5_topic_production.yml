name: TOP5 Topic-Driven Production
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Choose the subject; no code edits required"
        required: true
        type: choice
        default: dog_surprises
        options:
          - dog_surprises
          - cat_surprises
          - nature_moments
          - objects_oddities
          - human_moments
          - auto
  push:
    branches: [main]
    paths:
      - '.github/workflows/top5_topic_production.yml'
      - 'sample/top5_auto_topics_v30.json'
      - 'src/top5_auto_v32.py'
      - 'src/top5_auto_v29.py'
      - 'src/v28_fullscreen_builder.py'
      - 'src/top5_auto_v30.py'
      - 'src/topic_discovery_audit.py'
      - 'src/v12_sources.py'
      - 'src/v37_dog_audition.py'
permissions:
  contents: read
concurrency:
  group: top5-topic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  topic-to-mp4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOPIC: ${{ github.event.inputs.topic || 'dog_surprises' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source editing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-nanum fonts-noto-cjk
          python3 -m venv /tmp/top5-topic
          /tmp/top5-topic/bin/pip install -q numpy pillow
      - name: Run topic and editorial regression tests
        run: |
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_top5_auto_v32.py' -v
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_top5_auto_v30.py' -v
      - name: Audition real dog footage using proven V37 cat source pipeline
        run: /tmp/top5-topic/bin/python src/v37_dog_audition.py
      - name: Audit discovery and save failure evidence
        run: /tmp/top5-topic/bin/python src/topic_discovery_audit.py --topic "$TOPIC" --output output/topic_run/DISCOVERY_AUDIT.json
      - name: Verify external-source catalog validation
        run: |
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_v19_multisource_review.py' -v
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_v17_source_collection.py' -v
      - name: Produce topic-specific TOP5 review MP4
        run: /tmp/top5-topic/bin/python src/top5_auto_v32.py --topic "$TOPIC" --output output/topic_run
      - name: Full audio and video decode check
        run: ffmpeg -hide_banner -v error -xerror -i output/topic_run/TOP5_AUTO_V29_REVIEW_1080x1920.mp4 -map 0:v:0 -map 0:a:0 -f null -
      - name: Export review MP4 and rights evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TOP5-${{ env.TOPIC }}-review-${{ github.run_number }}
          path: |
            output/dog_audition/*.json
            output/dog_audition/*.jpg
            output/topic_run/*.mp4
            output/topic_run/*.json
            output/topic_run/*.md
            output/topic_run/*.jpg
          retention-days: 7
          if-no-files-found: warn
# Publication is intentionally disabled; source licensing and YPP require separate review.
