name: TOP5 Topic-Driven Production
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Choose the subject; no code edits required"
        required: true
        type: choice
        default: auto
        options:
          - dog_surprises
          - cat_surprises
          - nature_moments
          - objects_oddities
          - human_moments
          - auto
  push:
    branches: [main]
    paths:
      - '.github/workflows/top5_topic_production.yml'
      - 'sample/top5_auto_topics_v30.json'
      - 'src/top5_auto_v32.py'
      - 'src/top5_auto_v29.py'
      - 'src/v28_fullscreen_builder.py'
      - 'src/top5_auto_v30.py'
      - 'src/top5_candidate_visual_gate.py'
      - 'tests/test_top5_object_diversity.py'
      - 'src/top5_standard_scene_review.py'
      - 'src/top5_original_frame_evidence.py'
      - 'tests/test_top5_original_frame_evidence.py'
      - 'src/top5_smolvlm2_editorial.py'
      - '.github/workflows/top5_v38_vlm_scene_audit.yml'
      - 'tests/test_top5_smolvlm2_editorial.py'
      - 'tests/test_top5_standard_scene_review.py'
      - 'tests/test_top5_candidate_visual_gate.py'
      - 'sample/top5_auto_topics_v30.json'
      - 'review/top5_weak_source_windows.json'
      - 'tests/test_top5_reviewed_weak_windows.py'
      - 'src/topic_discovery_audit.py'
      - 'src/top5_all_source_license_audit.py'
      - 'review/top5_source_license_observations.json'
      - 'tests/test_top5_all_source_license_audit.py'
      - 'src/top5_topic_recovery.py'
      - 'tests/test_topic_discovery_audit.py'
      - 'tests/test_top5_topic_recovery.py'
      - 'src/v12_sources.py'
      - 'src/v37_dog_audition.py'
permissions:
  contents: read
concurrency:
  group: top5-topic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  topic-to-mp4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOPIC: ${{ github.event.inputs.topic || 'auto' }}
      # Independent workflow runs rotate among categories with >=5 eligible clips.
      TOP5_ROTATION_SEED: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source editing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-nanum fonts-noto-cjk
          python3 -m venv /tmp/top5-topic
          /tmp/top5-topic/bin/pip install -q numpy pillow
      - name: Run topic and editorial regression tests
        run: |
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_top5_auto_v32.py' -v
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_top5_auto_v30.py' -v
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_top5_reviewed_weak_windows.py' -v
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_top5_candidate_visual_gate.py' -v
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_top5_object_diversity.py' -v
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_top5_standard_scene_review.py' -v
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_top5_original_frame_evidence.py' -v
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_top5_smolvlm2_editorial.py' -v
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_top5_topic_workflow_policy.py' -v
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_topic_discovery_audit.py' -v
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_top5_topic_recovery.py' -v
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_top5_all_source_license_audit.py' -v
      - name: Audit discovery and save failure evidence
        run: /tmp/top5-topic/bin/python src/topic_discovery_audit.py --topic "$TOPIC" --output output/topic_run/DISCOVERY_AUDIT.json
      - name: Run dog-only visual source audition only if dog topic was actually selected
        run: |
          RESOLVED_TOPIC=$(/tmp/top5-topic/bin/python -c "import json; print(json.load(open('output/topic_run/DISCOVERY_AUDIT.json'))['topic'])")
          if test "$RESOLVED_TOPIC" = dog_surprises; then
            /tmp/top5-topic/bin/python src/v37_dog_audition.py
          else
            echo "Skipping dog-only audition for selected generic TOP5 topic: $RESOLVED_TOPIC"
          fi
      - name: Verify external-source catalog validation
        run: |
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_v19_multisource_review.py' -v
          /tmp/top5-topic/bin/python -m unittest discover -s tests -p 'test_v17_source_collection.py' -v
      - name: Produce verified selected topic; auto-only retry on actual source shortage
        run: |
          /tmp/top5-topic/bin/python src/top5_topic_recovery.py \
            --audit output/topic_run/DISCOVERY_AUDIT.json \
            --output-root output/topic_run
      - name: Full audio and video decode check
        run: ffmpeg -hide_banner -v error -xerror -i output/topic_run/TOP5_AUTO_V29_REVIEW_1080x1920.mp4 -map 0:v:0 -map 0:a:0 -f null -
      - name: Inspect 35 real ranked MP4 frames and 3 opening hook samples
        run: /tmp/top5-topic/bin/python src/top5_standard_scene_review.py --output output/topic_run
      - name: Capture 15 actual ORIGINAL source frames before composited TOP5 captions
        run: /tmp/top5-topic/bin/python src/top5_original_frame_evidence.py --output output/topic_run
      - name: Verify ranked sources plus independent 0-2s hook are accounted for in licence draft
        run: /tmp/top5-topic/bin/python src/top5_all_source_license_audit.py --output output/topic_run
      - name: Export review MP4 and rights evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TOP5-${{ env.TOPIC }}-review-${{ github.run_number }}
          path: |
            output/dog_audition/*.json
            output/dog_audition/*.jpg
            output/topic_run/*.mp4
            output/topic_run/*.json
            output/topic_run/*.md
            output/topic_run/*.jpg
            output/topic_run/V40_ORIGINAL_SOURCE_FRAMES/*.jpg
          retention-days: 7
          if-no-files-found: warn
# Publication is intentionally disabled; source licensing and YPP require separate review.
