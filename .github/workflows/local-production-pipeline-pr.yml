name: Local production pipeline fail-closed test
on:
  pull_request:
    paths:
      - 'src/local_production_pipeline.py'
      - 'tests/test_local_production_pipeline.py'
      - '.github/workflows/local-production-pipeline-pr.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy opencv-python-headless
      - run: python -m pytest -q tests/test_local_production_pipeline.py tests/test_verified_v32_handoff.py tests/test_v32_render_gate.py
      - run: python -m py_compile src/local_production_pipeline.py
