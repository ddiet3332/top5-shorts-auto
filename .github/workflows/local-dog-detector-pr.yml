name: Local dog detector unit tests
on:
  pull_request:
    paths:
      - 'src/local_dog_detector.py'
      - 'tests/test_local_dog_detector.py'
      - '.github/workflows/local-dog-detector-pr.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_local_dog_detector.py
