name: Gate 3 semantic contract tests
on:
  pull_request:
    paths:
      - 'src/gate3_semantic.py'
      - 'tests/test_gate3_semantic.py'
      - '.github/workflows/gate3-semantic-pr.yml'
jobs:
  gate3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_gate3_semantic.py
