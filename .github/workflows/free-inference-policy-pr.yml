name: Free-only inference policy tests
on:
  pull_request:
    paths:
      - 'config/inference_policy.json'
      - 'src/free_inference_policy.py'
      - 'tests/test_free_inference_policy.py'
      - '.github/workflows/free-inference-policy-pr.yml'
jobs:
  free-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_free_inference_policy.py
