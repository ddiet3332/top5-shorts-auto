# V28 original-source, no narration. Never auto-publish or claim YPP approval.
name: TOP5 V28 - original full-screen one-line review render
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v28.yml'
      - 'src/v28_fullscreen_builder.py'
      - 'tests/test_v28_layout.py'
      - 'sample/v22-sources.json'
      - 'sample/v22-mixed-selection.json'
permissions:
  contents: read
concurrency:
  group: v28-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Setup native video and Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-nanum fonts-noto-cjk
          python3 -m venv /tmp/v28_env
          /tmp/v28_env/bin/pip install --quiet pillow numpy
      - name: Run actual V28 layout and source-license gate tests
        run: /tmp/v28_env/bin/python -m unittest discover -s tests -p 'test_v28_layout.py' -v
      - name: Download 5 exact provider originals and build new true full-screen 30s
        run: /tmp/v28_env/bin/python src/v28_fullscreen_builder.py --output output
      - name: Verify full 30s decode of V28 final real-source video and audio
        run: |
          ffmpeg -hide_banner -v error -xerror -i output/TOP5_V28_FULLSCREEN_SINGLE_LINE_REVIEW_1080x1920.mp4 -map 0:v:0 -map 0:a:0 -f null -
      - name: Export full 30s review video and original 12-frame contact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TOP5-v28-fullscreen-${{ github.run_number }}
          path: |
            output/TOP5_V28_FULLSCREEN_SINGLE_LINE_REVIEW_1080x1920.mp4
            output/V28_ACTUAL_12FRAME_QA.jpg
            output/V28_TECHNICAL_QA.json
            output/v28_segments/editor_one_line_and_rank.ass
            output/v28_segments/original_5_clip_endcard.jpg
          retention-days: 7
          if-no-files-found: warn

  index:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record V28 run and artifact for direct mobile retrieval
        env:
          V28_RENDER_STATUS: ${{ needs.render.result }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git checkout --quiet -B v28-index origin/main
            mkdir -p review/v28_runs
            python3 - <<'PY'
          import json,os,pathlib
          repo=os.environ["GITHUB_REPOSITORY"]
          run=int(os.environ["GITHUB_RUN_ID"])
          number=int(os.environ["GITHUB_RUN_NUMBER"])
          status=os.environ["V28_RENDER_STATUS"]
          record={
            "version":"V28_FULLSCREEN",
            "run_id":run,"run_number":number,
            "render_result":status,
            "video_status":"RENDER_SUCCESS_REVIEW_ONLY" if status=="success" else "FAILED_OR_CANCELLED",
            "artifact_name":f"TOP5-v28-fullscreen-{number}",
            "artifact_url":f"https://github.com/{repo}/actions/runs/{run}#artifacts",
            "filename":"TOP5_V28_FULLSCREEN_SINGLE_LINE_REVIEW_1080x1920.mp4" if status=="success" else None,
            "source_count":5,
            "no_voiceover":True,"no_tts":True,
            "individual_original_source_rights_verified":False,
            "youtube_monetization_approved":False,
            "publication_approved":False,
            "full_comedy_editorial_score":None
          }
          data=json.dumps(record,ensure_ascii=False,indent=2)+"\n"
          pathlib.Path("review/v28_latest.json").write_text(data,encoding="utf-8")
          pathlib.Path(f"review/v28_runs/{run}.json").write_text(data,encoding="utf-8")
          PY
            git add review/v28_latest.json review/v28_runs/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "index: V28 full-screen 30s source-video review $GITHUB_RUN_NUMBER"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
