# Automated recommendation -> licensed-metadata source discovery -> 30s V28.3
# template review draft. This workflow DOES NOT upload to YouTube or certify rights.
name: TOP5 V29 - Auto topic to 30s review MP4
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "auto, cat_surprises, dog_surprises, nature_moments, objects_oddities, human_moments"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - cat_surprises
          - dog_surprises
          - nature_moments
          - objects_oddities
          - human_moments
  push:
    branches: [main]
    paths:
      - '.github/workflows/top5_auto_v29.yml'
      - 'src/top5_auto_v29.py'
      - 'tests/test_top5_auto_v29.py'
      - 'sample/top5_auto_topics.json'
permissions:
  contents: read
concurrency:
  group: v29-auto-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  create-review-mp4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Setup tools and no-cost image libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-nanum fonts-noto-cjk
          python3 -m venv /tmp/v29env
          /tmp/v29env/bin/pip install --quiet numpy pillow
      - name: Run topic rights and layout safeguards
        run: |
          /tmp/v29env/bin/python -m unittest discover -s tests -p 'test_top5_auto_v29.py' -v
          /tmp/v29env/bin/python -m unittest discover -s tests -p 'test_v28_layout.py' -v
      - name: Automatically recommend a subject, source five originals and render
        env:
          SELECTED_TOPIC: \${{ github.event.inputs.topic || 'auto' }}
        run: |
          /tmp/v29env/bin/python src/top5_auto_v29.py --topic "$SELECTED_TOPIC" --output output/v29_auto
      - name: Confirm full 30 second MP4 video and audio decoding
        run: |
          ffmpeg -hide_banner -v error -xerror -i output/v29_auto/TOP5_AUTO_V29_REVIEW_1080x1920.mp4 -map 0:v:0 -map 0:a:0 -f null -
      - name: Upload generated video, topic recommendations, rights report and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TOP5-V29-auto-review-\${{ github.run_number }}
          path: |
            output/v29_auto/TOP5_AUTO_V29_REVIEW_1080x1920.mp4
            output/v29_auto/V29_ACTUAL_12FRAME_QA.jpg
            output/v29_auto/V29_TECHNICAL_QA.json
            output/v29_auto/TOPIC_RECOMMENDATIONS.json
            output/v29_auto/SOURCE_SELECTION_REVIEW.json
            output/v29_auto/SOURCE_CREDITS_REVIEW.md
          retention-days: 7
          if-no-files-found: warn
