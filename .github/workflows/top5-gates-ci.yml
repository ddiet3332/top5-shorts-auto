name: TOP5 gates CI
on:
  push:
    paths:
      - 'src/top5_publication_gate.py'
      - 'src/top5_watchdog_decision.py'
      - 'src/top5_remediation.py'
      - 'tests/test_top5_publication_gate.py'
      - 'tests/test_top5_watchdog_decision.py'
      - 'tests/test_top5_remediation.py'
      - '.github/workflows/top5-gates-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Quality and watchdog gate tests
        run: python -m unittest discover -s tests -p 'test_top5_*gate.py' -v
      - name: Scene repair planning tests
        run: python -m unittest discover -s tests -p 'test_top5_remediation.py' -v
      - name: Retry-decision tests
        run: python -m unittest discover -s tests -p 'test_top5_watchdog_decision.py' -v
