# V25 is a nonverbal situation-caption experiment. Original raw camera audio is never auto-used.
# Strictly a private REVIEW MASTER. Never upload to YouTube automatically.
name: TOP5 V25 - no narration situational subtitle actual 30-second review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v25.yml'
      - 'src/v25_qa.py'
      - 'src/v25_original_audio_audit.py'
      - 'src/v25_editorial_finish.py'
      - 'src/publish_v25_video_index.py'
      - 'sample/v25-situation-captions.json'
      - 'src/v22_audio_remaster.py'
      - 'tests/test_v25_caption_only.py'
      - 'sample/v22-sources.json'
      - 'sample/v22-mixed-selection.json'
      - 'sample/v25-render-script.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Korean caption fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-nanum fonts-noto-cjk
      - name: Run source and editorial safety regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Download five exact curated originals and render full 30s H264 AAC
        run: |
          python3 src/v12_mixed_draft.py \
            --sources sample/v22-sources.json \
            --selection sample/v22-mixed-selection.json \
            --script sample/v25-render-script.json \
            --title '고양이 돌발 행동 TOP5' --v16-pacing --output output
      - name: Export complete 10s CC0 cat source for frame-accurate rank2 timing QA
        run: |
          test -f output/clips/mixed_04.webm
          ffmpeg -hide_banner -loglevel error -y -i output/clips/mixed_04.webm \
            -t 10.3 -vf "scale=540:960:force_original_aspect_ratio=decrease,pad=540:960:(ow-iw)/2:(oh-ih)/2:color=black,fps=12,setsar=1" \
            -an -c:v libx264 -preset veryfast -crf 30 -movflags +faststart \
            output/V25_RANK2_UNCUT_SOURCE_QA.mp4
      - name: Audit real original-source audio streams without using them
        run: python3 src/v25_original_audio_audit.py --clips output/clips --output output/V25_SOURCE_AUDIO_AUDIT.json
      - name: Decode every video frame and audio sample and verify 5 sources
        run: python3 src/v25_qa.py --output output --selection sample/v22-mixed-selection.json --video output/TOP5_DRAFT_REVIEW_ONLY_1080x1920.mp4
      - name: Retain self-produced nonverbal soundtrack with no TTS or original-source audio
        run: |
          python3 -m venv /tmp/v22_audio_env
          /tmp/v22_audio_env/bin/pip install --quiet numpy
          /tmp/v22_audio_env/bin/python src/v22_audio_remaster.py \
            --input output/TOP5_DRAFT_REVIEW_ONLY_1080x1920.mp4 \
            --output output/TOP5_V25_AUDIO_ONLY_REVIEW_1080x1920.mp4 \
            --scratch output/v25_audio_temp
      - name: Validate improved full 30s A/V remaster source and ranking
        run: |
          python3 src/v25_qa.py \
            --output output \
            --selection sample/v22-mixed-selection.json \
            --video output/TOP5_V25_AUDIO_ONLY_REVIEW_1080x1920.mp4
      - name: Render V25 actual situation captions and 5-footage comparison endcard
        run: |
          python3 -m venv /tmp/v25_editorial_env
          /tmp/v25_editorial_env/bin/pip install --quiet pillow opencv-python-headless
          /tmp/v25_editorial_env/bin/python src/v25_editorial_finish.py \
            --input output/TOP5_V25_AUDIO_ONLY_REVIEW_1080x1920.mp4 \
            --output output/TOP5_V25_SITUATION_CAPTIONS_REVIEW_ONLY_1080x1920.mp4 \
            --scratch output/v25_editorial_work
      - name: QA final V25 main video/audio streams and five unique source ranks
        run: |
          python3 src/v25_qa.py \
            --output output \
            --selection sample/v22-mixed-selection.json \
            --video output/TOP5_V25_SITUATION_CAPTIONS_REVIEW_ONLY_1080x1920.mp4
      - name: Export fixed 100-point QA rubric (actual grade requires review)
        if: always()
        run: python3 src/qa_scorecard.py --output output --run "$GITHUB_RUN_NUMBER" --stage final_review_pending
      - name: Upload actual 30s NO NARRATION review video, sound audit, rights and frame evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TOP5-v25-video-${{ github.run_number }}
          path: |
            output/TOP5_DRAFT_REVIEW_ONLY_1080x1920.mp4
            output/TOP5_V25_AUDIO_ONLY_REVIEW_1080x1920.mp4
            output/TOP5_V25_SITUATION_CAPTIONS_REVIEW_ONLY_1080x1920.mp4
            output/v25_editorial_work/V25_TECHNICAL_QA.json
            output/V25_SOURCE_AUDIO_AUDIT.json
            output/V25_TECHNICAL_QA.json
            output/V25_TECHNICAL_QA.md
            output/V12_MIXED_RIGHTS_AUDIT.json
            output/SHOTLIST_FOR_REVIEW.json
            output/VOICEOVER_TIMELINE.json
            # No TTS or narration source is requested or uploaded
            output/V11_REACTION_SFX.json
            output/YOUTUBE_CREDITS.txt
            output/RIGHTS_CHECKLIST.md
            output/QA_CONTACT_SHEET.jpg
            output/V25_RANK2_UNCUT_SOURCE_QA.mp4
            output/TOP5_100_POINT_SCORECARD.json
            output/TOP5_100_POINT_SCORECARD.md
          if-no-files-found: warn
          retention-days: 7
  index:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download only same-run QA metadata, never commit licensed source video
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: TOP5-v25-video-${{ github.run_number }}
          path: output
      - name: Publish latest run ID for direct ChatGPT artifact download
        env:
          RENDER_RESULT: ${{ needs.render.result }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git checkout --quiet -B v25-video-index origin/main
            python3 src/publish_v25_video_index.py \
              --qa output/V25_TECHNICAL_QA.json \
              --rights output/V12_MIXED_RIGHTS_AUDIT.json \
              --repo "$GITHUB_REPOSITORY" \
              --run-id "$GITHUB_RUN_ID" \
              --run-number "$GITHUB_RUN_NUMBER" \
              --result "$RENDER_RESULT" \
              --review review
            git add review/v25_video_latest.json review/v25_video_runs/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "index: V25 rendered review video $GITHUB_RUN_NUMBER [$GITHUB_RUN_ID]"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'V25 index push failed after retries' >&2
          exit 1
